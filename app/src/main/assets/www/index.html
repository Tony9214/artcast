<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArtCast 上传</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<header>ArtCast</header>

<section class="card" id="drop">
  <input type="file" id="file" accept="image/*" hidden>
  <div id="preview">＋ 选择图片上传</div>
</section>

<section class="card">
  <div class="label">显示模式</div>
  <div class="row" id="modes">
    <button data-mode="original">原图</button>
    <button data-mode="sketch">素描</button>
    <button data-mode="edge">边缘</button>
  </div>
  <div class="row">
    <button id="grid">网格 关</button>
    <button id="invert">反色 关</button>
  </div>
  <div class="row">
    <button id="grid-n">九宫格密度 3</button>
    <button id="reset">复位四角</button>
  </div>
</section>

<section class="card">
  <div class="label">历史记录</div>
  <div id="history"></div>
</section>

<script src="phone.js"></script>
</body>
</html>
