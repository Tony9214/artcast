plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def keystoreProps = new Properties()
def keystoreFile = file(System.getProperty("user.home") + "/.artcast/keystore.properties")
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

android {
    namespace "cc.lumina.artcast"
    compileSdk 34

    defaultConfig {
        applicationId "cc.lumina.artcast"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "0.0.2"
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    implementation "androidx.core:core-ktx:1.13.1"
}
