plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "cc.lumina.artcast"
    compileSdk 34

    defaultConfig {
        applicationId "cc.lumina.artcast"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    implementation "androidx.core:core-ktx:1.13.1"
}
